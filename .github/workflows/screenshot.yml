name: Update lab screen image
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: node screenshot.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add Lab-Desktop.jpg
          git diff --cached --quiet || (git commit -m "Update lab screen image" && git push)
